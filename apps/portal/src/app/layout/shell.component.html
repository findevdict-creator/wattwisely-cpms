<mat-toolbar class="top-bar">
  <span class="brand">Wattwisely</span>
  <ww-tenant-switcher />
  <span class="spacer"></span>
  @if (tenantContext.me(); as me) {
    <button mat-button [matMenuTriggerFor]="userMenu" data-testid="user-menu">
      <mat-icon>account_circle</mat-icon>
      {{ me.name || me.email }}
    </button>
    <mat-menu #userMenu="matMenu">
      <div class="user-details" mat-menu-item disabled>{{ me.email }}</div>
      <button mat-menu-item (click)="logout()" data-testid="logout">
        <mat-icon>logout</mat-icon>
        Log out
      </button>
    </mat-menu>
  }
</mat-toolbar>

<mat-sidenav-container class="body">
  <mat-sidenav mode="side" opened class="side-menu">
    <mat-nav-list>
      <a
        mat-list-item
        routerLink="/"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
      >
        <mat-icon matListItemIcon>home</mat-icon>
        <span matListItemTitle>Home</span>
      </a>
    </mat-nav-list>
  </mat-sidenav>
  <mat-sidenav-content class="page">
    <router-outlet />
  </mat-sidenav-content>
</mat-sidenav-container>
