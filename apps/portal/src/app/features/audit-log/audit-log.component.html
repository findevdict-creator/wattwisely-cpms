<h1>Audit log</h1>

<table mat-table [dataSource]="entries()" class="entries" data-testid="audit-log">
  <ng-container matColumnDef="occurred_at">
    <th mat-header-cell *matHeaderCellDef>When</th>
    <td mat-cell *matCellDef="let entry">{{ entry.occurred_at | date: 'medium' }}</td>
  </ng-container>
  <ng-container matColumnDef="actor">
    <th mat-header-cell *matHeaderCellDef>Who</th>
    <td mat-cell *matCellDef="let entry">{{ entry.actor_label }}</td>
  </ng-container>
  <ng-container matColumnDef="action">
    <th mat-header-cell *matHeaderCellDef>What</th>
    <td mat-cell *matCellDef="let entry">
      <code>{{ entry.action }}</code>
    </td>
  </ng-container>
  <ng-container matColumnDef="target">
    <th mat-header-cell *matHeaderCellDef>On</th>
    <td mat-cell *matCellDef="let entry">{{ entry.target_label ?? entry.target_type }}</td>
  </ng-container>
  <tr mat-header-row *matHeaderRowDef="columns"></tr>
  <tr mat-row *matRowDef="let row; columns: columns"></tr>
</table>

@if (error()) {
  <p class="error" role="alert">{{ error() }}</p>
}
@if (nextCursor()) {
  <button mat-stroked-button class="more" (click)="loadMore()">Show older entries</button>
}
