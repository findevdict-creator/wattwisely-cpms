<ww-page-header
  [heading]="proposal()?.name ?? 'Proposal'"
  backLink="/tariffs/proposals"
  backLabel="Tariff proposals"
  subtitle="Nothing changes until an Owner approves. Sessions already running keep their prices."
>
  @if (proposal()?.tariff_id; as tariffId) {
    <a mat-stroked-button [routerLink]="['/tariffs', tariffId]">
      <mat-icon svgIcon="tag" />
      Open the tariff
    </a>
  }
</ww-page-header>

@if (proposal(); as p) {
  <div class="ww-columns">
    <div class="ww-main">
      <ww-proposal-review [proposal]="p" (changed)="proposal.set($event)" />
    </div>
    <div class="ww-side">
      <ww-proposal-prices [prices]="p.prices" [currency]="p.currency" />
    </div>
  </div>
  <ww-proposal-bands [prices]="p.prices" [currency]="p.currency" />
}
@if (error()) {
  <div class="notice danger" role="alert" data-testid="proposal-error">{{ error() }}</div>
}
