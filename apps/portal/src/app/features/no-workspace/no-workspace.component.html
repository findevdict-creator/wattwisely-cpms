<ww-auth-page
  heading="No workspace yet"
  subtitle="Your login works, but you are not a member of any company on Wattwisely yet."
>
  <div class="notice neutral" data-testid="no-workspace">
    Ask your company's Owner to invite {{ email() || 'you' }}, or contact Wattwisely support.
  </div>
  <button mat-stroked-button class="wide" (click)="logout()">
    <mat-icon svgIcon="log-out" />
    Log out
  </button>
</ww-auth-page>
