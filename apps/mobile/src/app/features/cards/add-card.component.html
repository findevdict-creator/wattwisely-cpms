<ion-content>
  <div class="ww-page">
    <ww-page-bar title="Add a card" [backTo]="backTo()" />

    <div #host class="host" data-testid="card-form"></div>
    @if (!adder.isReady() && !adder.error()) {
      <ion-spinner class="loading" name="crescent" />
    }

    @if (adder.error()) {
      <p class="ww-error" role="alert" data-testid="error">{{ adder.error() }}</p>
    }

    <ion-checkbox
      labelPlacement="end"
      justify="start"
      [checked]="isDefault()"
      (ionChange)="isDefault.set($event.detail.checked)"
      data-testid="default"
    >
      Use as my default card
    </ion-checkbox>

    <p class="note">
      <mat-icon svgIcon="lock" />
      Your card details go straight to Stripe and never touch Wattwisely's servers.
    </p>

    <ion-button
      class="ww-large"
      expand="block"
      [disabled]="!adder.isReady() || adder.isSaving()"
      (click)="save()"
      data-testid="save-card"
    >
      @if (adder.isSaving()) {
        <ion-spinner name="crescent" />
      } @else {
        Save card
      }
    </ion-button>
  </div>
</ion-content>
