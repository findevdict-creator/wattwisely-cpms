<ion-content>
  <div class="ww-page">
    <h1>Account</h1>
    <section class="ww-card who" data-testid="who">
      <span class="avatar" aria-hidden="true">{{ initials() }}</span>
      <span class="names">
        <strong data-testid="name">{{ store.me()?.display_name }}</strong>
        <span class="ww-lead" data-testid="email">{{ store.me()?.email }}</span>
      </span>
    </section>
    @if (store.error()) {
      <p class="error" role="alert">{{ store.error() }}</p>
    }
    <ion-button
      class="ww-large"
      expand="block"
      fill="outline"
      color="danger"
      data-testid="sign-out"
      (click)="signOut()"
    >
      Sign out
    </ion-button>
    @if (version()) {
      <p class="version" data-testid="version">Version {{ version() }}</p>
    }
  </div>
</ion-content>
