<mat-sidenav-container class="frame" [class.beside]="!isNarrow()" [class.rail]="isRail()">
  <mat-sidenav
    #drawer
    class="side"
    [mode]="isNarrow() ? 'over' : 'side'"
    [opened]="!isNarrow()"
    [fixedInViewport]="isNarrow()"
  >
    <ww-side-menu [url]="url()" [isCollapsed]="isRail()" (navigated)="closeIfNarrow()" />
  </mat-sidenav>
  <mat-sidenav-content class="main">
    <ww-top-bar
      [where]="where()"
      [isNarrow]="isNarrow()"
      [isMenuCollapsed]="isRail()"
      (menuOpened)="drawer.open()"
      (menuToggled)="sideMenu.toggle()"
    />
    <main class="content">
      <router-outlet />
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
