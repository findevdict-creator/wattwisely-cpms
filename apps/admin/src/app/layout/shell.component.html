<mat-toolbar class="top-bar">
  <span class="brand">Wattwisely Admin</span>
  <span class="ww-chip dark" data-testid="staff-console">Staff console</span>
  <span class="ww-chip role" data-testid="my-role">{{ staff.roleName() }}</span>
  <span class="spacer"></span>
  @if (staff.me(); as me) {
    <button mat-button [matMenuTriggerFor]="userMenu" data-testid="user-menu">
      <mat-icon svgIcon="circle-user-round" />
      {{ me.name || me.email }}
    </button>
    <mat-menu #userMenu="matMenu">
      <div class="user-details" mat-menu-item disabled>{{ me.email }}</div>
      <button mat-menu-item (click)="logout()" data-testid="logout">
        <mat-icon svgIcon="log-out" />
        Log out
      </button>
    </mat-menu>
  }
</mat-toolbar>

<mat-sidenav-container class="body">
  <mat-sidenav mode="side" opened class="side-menu">
    <mat-nav-list>
      <a
        mat-list-item
        routerLink="/"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
      >
        <mat-icon matListItemIcon svgIcon="layout-dashboard" />
        <span matListItemTitle>Overview</span>
      </a>
      <a mat-list-item routerLink="/tenants" routerLinkActive="active" data-testid="nav-tenants">
        <mat-icon matListItemIcon svgIcon="building-2" />
        <span matListItemTitle>Tenants</span>
      </a>
      @if (staff.can('plans:read')) {
        <a mat-list-item routerLink="/plans" routerLinkActive="active" data-testid="nav-plans">
          <mat-icon matListItemIcon svgIcon="tag" />
          <span matListItemTitle>Plans</span>
        </a>
      }
      @if (staff.can('staff:read')) {
        <a mat-list-item routerLink="/staff" routerLinkActive="active" data-testid="nav-staff">
          <mat-icon matListItemIcon svgIcon="id-card" />
          <span matListItemTitle>Staff</span>
        </a>
      }
      @if (staff.can('billing:read')) {
        <a
          mat-list-item
          routerLink="/invoices"
          routerLinkActive="active"
          data-testid="nav-invoices"
        >
          <mat-icon matListItemIcon svgIcon="receipt-text" />
          <span matListItemTitle>Invoices</span>
        </a>
      }
      @if (staff.can('platform_audit:read')) {
        <a mat-list-item routerLink="/audit-log" routerLinkActive="active">
          <mat-icon matListItemIcon svgIcon="history" />
          <span matListItemTitle>Audit log</span>
        </a>
      }
    </mat-nav-list>
  </mat-sidenav>
  <mat-sidenav-content class="page">
    <router-outlet />
  </mat-sidenav-content>
</mat-sidenav-container>
