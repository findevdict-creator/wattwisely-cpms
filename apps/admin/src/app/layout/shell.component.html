<mat-sidenav-container class="frame">
  <mat-sidenav
    #drawer
    class="side"
    [mode]="isNarrow() ? 'over' : 'side'"
    [opened]="!isNarrow()"
    [fixedInViewport]="isNarrow()"
  >
    <ww-side-menu [url]="url()" (navigated)="closeIfNarrow()" />
  </mat-sidenav>
  <mat-sidenav-content class="main">
    <ww-top-bar [where]="where()" [isNarrow]="isNarrow()" (menuOpened)="drawer.open()" />
    <main class="content">
      <router-outlet />
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
