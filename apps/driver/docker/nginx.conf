server {
  listen 8080;
  root /usr/share/nginx/html;

  # Angular routes are handled in the browser: unknown paths get index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Hashed bundles never change, so browsers may keep them for a year.
  location ~* \.(js|css|woff2?|ico|png|svg)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Settings and the app entry point must always be fresh.
  location = /config.json {
    add_header Cache-Control "no-store";
  }
  location = /index.html {
    add_header Cache-Control "no-store";
  }

  location = /healthz {
    access_log off;
    return 200 "ok\n";
  }
}
