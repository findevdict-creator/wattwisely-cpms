<header class="who">
  <span class="ww-avatar l">{{ initials() }}</span>
  <span class="ww-two">
    <h1>{{ store.me()?.display_name || 'Your account' }}</h1>
    @if (store.me(); as me) {
      <span data-testid="account-email">{{ me.email }}</span>
    }
  </span>
</header>

@if (store.me()) {
  <nav class="panel list" aria-label="Account">
    @for (row of menu(); track row.link) {
      <a class="ww-list-item" [routerLink]="row.link" [attr.data-testid]="row.testId">
        <span class="ww-avatar m"><mat-icon [svgIcon]="row.icon" /></span>
        <span class="ww-two ww-grow">
          <b>{{ row.title }}</b>
          <span>{{ row.line }}</span>
        </span>
        <mat-icon class="chevron" svgIcon="chevron-right" />
      </a>
    }
  </nav>
  <button mat-stroked-button class="ww-large" (click)="auth.logout()" data-testid="logout">
    <mat-icon svgIcon="log-out" />
    Log out
  </button>
} @else if (store.error()) {
  <section class="panel">
    <p class="notice danger" role="alert">{{ store.error() }}</p>
    <button mat-stroked-button (click)="auth.logout()">Log out</button>
  </section>
} @else {
  <div class="loading"><mat-spinner diameter="32" /></div>
}
