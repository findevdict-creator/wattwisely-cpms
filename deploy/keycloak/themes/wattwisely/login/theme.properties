# Wattwisely's sign-in pages: Keycloak's own keycloak.v2 pages in the platform's look.
# tokens.css and img/mark.svg are generated from packages/theme/theme.json
# (`npx nx run theme:generate`); wattwisely.css maps them onto PatternFly.
parent=keycloak.v2
import=common/keycloak

styles=css/styles.css css/fonts.css css/tokens.css css/wattwisely.css css/forms.css

# Light only, as the apps.
darkMode=false
