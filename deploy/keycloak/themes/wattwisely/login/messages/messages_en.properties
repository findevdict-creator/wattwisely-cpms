# Wattwisely's wording for Keycloak's sign-in pages, from the approved screens. A key that is not
# here keeps Keycloak's own English. Keycloak runs every message through Java's MessageFormat, so
# an apostrophe is written twice: don''t.
#
# This theme's own keys: wwTitle, wwSubtitle and wwFooterHtml, and any key followed by a page,
# or by a page and an app, such as doSubmit.login-reset-password or
# wwSubtitle.login.wattwisely-driver. ww.ftl explains how a page finds its wording.

