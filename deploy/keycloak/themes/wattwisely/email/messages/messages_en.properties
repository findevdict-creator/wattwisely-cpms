# Wattwisely's wording for the e-mails Keycloak sends. A key that is not here keeps Keycloak's own
# English. Keycloak runs every message through Java's MessageFormat, so an apostrophe is written
# twice: didn''t. The *Heading, *Intro, *Action and *Ignore keys are this theme's own, for the
# HTML e-mails in html/; the *Body keys are the plain-text versions.

emailFooter={0}
linkWorksFor=The link works for {0}.

# Reset your password
passwordResetSubject=Reset your Wattwisely password
passwordResetHeading=Reset your password
passwordResetIntro=Someone asked to reset the password of your {0} account. If that was you, choose a new password with the button below.
passwordResetAction=Choose a new password
passwordResetIgnore=If it wasn''t you, ignore this e-mail: your password stays as it is.
passwordResetBody=Someone asked to reset the password of your {2} account. If that was you, choose a new password here:\n\n{0}\n\nThe link works for {3}.\n\nIf it wasn''t you, ignore this e-mail: your password stays as it is.

# Confirm your e-mail (after creating an account)
emailVerificationSubject=Confirm your e-mail for Wattwisely
emailVerificationHeading=Confirm your e-mail
emailVerificationIntro=Thanks for creating a {0} account. Confirm that this is your e-mail to finish.
emailVerificationAction=Confirm e-mail
emailVerificationIgnore=If you didn''t create an account, ignore this e-mail.
emailVerificationBody=Thanks for creating a {2} account. Confirm that this is your e-mail to finish:\n\n{0}\n\nThe link works for {3}.\n\nIf you didn''t create an account, ignore this e-mail.

# Confirm a new e-mail
emailUpdateConfirmationSubject=Confirm your new e-mail
emailUpdateConfirmationHeading=Confirm your new e-mail
emailUpdateConfirmationIntro=To sign in to your {1} account with {0} from now on, confirm it with the button below.
emailUpdateConfirmationAction=Confirm new e-mail
emailUpdateConfirmationIgnore=If you didn''t ask for this, ignore this e-mail: your account keeps its e-mail.
emailUpdateConfirmationBody=To sign in to your {2} account with {1} from now on, confirm it here:\n\n{0}\n\nThe link works for {3}.\n\nIf you didn''t ask for this, ignore this e-mail: your account keeps its e-mail.

# Sent from Keycloak's admin console ("Send e-mail" with required actions)
executeActionsSubject=Update your Wattwisely account
executeActionsHeading=Update your account
executeActionsIntro=An administrator asked you to do this for your {0} account: {1}.
executeActionsAction=Update my account
executeActionsIgnore=If you didn''t expect this, ignore this e-mail and nothing changes.
executeActionsBody=An administrator asked you to do this for your {2} account: {3}.\n\n{0}\n\nThe link works for {4}.\n\nIf you didn''t expect this, ignore this e-mail and nothing changes.
requiredAction.CONFIGURE_TOTP=set up two-step sign-in
requiredAction.UPDATE_PASSWORD=choose a new password
requiredAction.UPDATE_PROFILE=check your name and e-mail
requiredAction.VERIFY_EMAIL=confirm your e-mail
requiredAction.TERMS_AND_CONDITIONS=accept the terms

emailTestSubject=Test e-mail from Wattwisely
emailTestBody=This is a test e-mail. Keycloak can send e-mail.
emailTestBodyHtml=<p>This is a test e-mail. Keycloak can send e-mail.</p>
