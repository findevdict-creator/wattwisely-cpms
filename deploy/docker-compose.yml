# Wattwisely CPMS - the whole platform on one server.
#
# Start it with ./scripts/up.sh (not "docker compose up" directly): the script
# also unseals OpenBao and waits until every service is healthy.
# All settings come from .env, created by ./scripts/install.sh from .env.example.
#
# Only Caddy is reachable from the internet (ports 80 and 443). Everything else
# talks over the private "backend" network.

name: wattwisely

x-restart: &restart
  restart: unless-stopped

x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: 20m
      max-file: '5'

services:
  # ---------- Entry point: HTTPS certificates and routing ----------
  caddy:
    image: caddy:2.11.7-alpine
    <<: [*restart, *logging]
    ports:
      - '80:80'
      - '443:443'
    environment:
      PUBLIC_SCHEME: ${PUBLIC_SCHEME}
      PORTAL_HOST: ${PORTAL_HOST}
      API_HOST: ${API_HOST}
      AUTH_HOST: ${AUTH_HOST}
      OCPP_HOST: ${OCPP_HOST}
      OCPP_PLAIN_HOST: ${OCPP_PLAIN_HOST}
      DRIVER_HOST: ${DRIVER_HOST}
      ADMIN_HOST: ${ADMIN_HOST}
      ACME_EMAIL: ${ACME_EMAIL}
      KEYCLOAK_ADMIN_ALLOWED_IPS: ${KEYCLOAK_ADMIN_ALLOWED_IPS:-private_ranges}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [backend]
    depends_on:
      api: { condition: service_healthy }
      portal: { condition: service_healthy }
      driver: { condition: service_healthy }
      admin: { condition: service_healthy }
      ocpp-gateway: { condition: service_healthy }
      keycloak: { condition: service_healthy }

  # ---------- Wattwisely applications ----------
  api:
    image: ${WATTWISELY_IMAGE_PREFIX}/api:${WATTWISELY_VERSION}
    build: { context: .., dockerfile: apps/api/Dockerfile }
    <<: [*restart, *logging]
    environment:
      PORT: 3000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CORS_ORIGINS: ${PUBLIC_SCHEME}://${PORTAL_HOST},${PUBLIC_SCHEME}://${DRIVER_HOST},${PUBLIC_SCHEME}://${ADMIN_HOST},${PORTAL_DEV_URL:-${PUBLIC_SCHEME}://${PORTAL_HOST}},${ADMIN_DEV_URL:-${PUBLIC_SCHEME}://${ADMIN_HOST}},${DRIVER_DEV_URL:-${PUBLIC_SCHEME}://${DRIVER_HOST}}
      # The issuer is the public address written into tokens; the keys are fetched over the private network.
      KEYCLOAK_ISSUER_URL: ${PUBLIC_SCHEME}://${AUTH_HOST}/realms/wattwisely
      KEYCLOAK_JWKS_URL: http://keycloak:8080/realms/wattwisely/protocol/openid-connect/certs
      KEYCLOAK_AUDIENCE: wattwisely-api
      # Tokens from the driver app (module 19) carry this audience instead; they only open /v1/driver/*.
      KEYCLOAK_DRIVER_AUDIENCE: wattwisely-driver
      # Row-level security applies to this role; up.sh creates it and runs the migrations first.
      DATABASE_URL: postgres://wattwisely_app:${DB_APP_PASSWORD}@postgres:5432/wattwisely
      # The API's own public address (module 8): tenant logos in e-mails and on driver pages are linked from here.
      API_URL: ${PUBLIC_SCHEME}://${API_HOST}
      # Invitation e-mails link here.
      PORTAL_URL: ${PUBLIC_SCHEME}://${PORTAL_HOST}
      # The driver app (module 7): the QR codes on the chargers point here.
      DRIVER_URL: ${PUBLIC_SCHEME}://${DRIVER_HOST}
      # Where chargers connect (served by ocpp-gateway below); printed on charger setup cards.
      OCPP_URL: ${OCPP_URL}
      OCPP_PLAIN_URL: ${OCPP_PLAIN_URL}
      # Card payments through Stripe Connect (module 6). Empty keys switch card payments off.
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_FROM: ${SMTP_FROM}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-false}
      # Module 12: export files live in object storage (the same bucket as the worker writes).
      S3_ENDPOINT: http://object-storage:8333
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      # Caddy is the one proxy in front: the client address is the one Caddy saw, for the
      # rate limits and the audit log. Caddy replaces any X-Forwarded-For the client sent.
      TRUST_PROXY_HOPS: 1
      # Requests per client address and minute; RATE_LIMIT_ENABLED=false turns the limits off.
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-1200}
      RATE_LIMIT_PUBLIC_PER_MINUTE: ${RATE_LIMIT_PUBLIC_PER_MINUTE:-300}
      RATE_LIMIT_PUBLIC_WRITE_PER_MINUTE: ${RATE_LIMIT_PUBLIC_WRITE_PER_MINUTE:-30}
      # Module 16: requests per API key and minute. Webhook endpoints must be public addresses.
      RATE_LIMIT_API_KEY_PER_MINUTE: ${RATE_LIMIT_API_KEY_PER_MINUTE:-600}
      WEBHOOK_ALLOW_PRIVATE_URLS: 'false'
      # Module 17: the WhatsApp Business app behind the messaging add-on.
      WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET:-}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:-}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      # The interactive API reference at /docs. Off unless asked for.
      API_DOCS_ENABLED: ${API_DOCS_ENABLED:-false}
    networks: [backend]
    depends_on:
      postgres: { condition: service_healthy }
      keycloak: { condition: service_healthy }
      object-storage: { condition: service_started }

  portal:
    image: ${WATTWISELY_IMAGE_PREFIX}/portal:${WATTWISELY_VERSION}
    build: { context: .., dockerfile: apps/portal/Dockerfile }
    <<: [*restart, *logging]
    environment:
      PORTAL_API_URL: ${PUBLIC_SCHEME}://${API_HOST}
      PORTAL_KEYCLOAK_URL: ${PUBLIC_SCHEME}://${AUTH_HOST}
      PORTAL_KEYCLOAK_REALM: wattwisely
      PORTAL_KEYCLOAK_CLIENT_ID: wattwisely-portal
      # Wattwisely staff get a link to the admin console (module 9) in the portal's user menu.
      PORTAL_ADMIN_URL: ${PUBLIC_SCHEME}://${ADMIN_HOST}
    networks: [backend]

  # Chargers connect here over WebSocket (OCPP 1.6J or 2.0.1). Caddy terminates TLS and forwards
  # ws://ocpp-gateway:3100/ocpp/<identity>; the gateway talks to the API through Postgres.
  ocpp-gateway:
    image: ${WATTWISELY_IMAGE_PREFIX}/ocpp-gateway:${WATTWISELY_VERSION}
    build: { context: .., dockerfile: apps/ocpp-gateway/Dockerfile }
    <<: [*restart, *logging]
    environment:
      PORT: 3100
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgres://wattwisely_app:${DB_APP_PASSWORD}@postgres:5432/wattwisely
      # Caddy sets X-Forwarded-Proto, so the gateway knows wss from ws and refuses plain ws
      # unless the charger was registered with "allow plain ws".
      OCPP_TRUST_PROXY: 'true'
      OCPP_REQUIRE_TLS: ${OCPP_REQUIRE_TLS:-true}
      OCPP_ACCEPT_UNKNOWN_ID_TAGS: ${OCPP_ACCEPT_UNKNOWN_ID_TAGS:-false}
      # New connections allowed per client address and minute. Raise it for a load test.
      OCPP_RATE_LIMIT_PER_IP: ${OCPP_RATE_LIMIT_PER_IP:-100}
    networks: [backend]
    depends_on:
      postgres: { condition: service_healthy }
      api: { condition: service_healthy }

  # Background jobs for charging sessions: final prices once the car leaves, the running
  # cost every 30 seconds, and closing sessions whose charger went silent for a day. Since
  # module 11 also charger alerts, every e-mail the platform sends, and report exports.
  # No inbound traffic; it talks to the others through Postgres.
  worker:
    image: ${WATTWISELY_IMAGE_PREFIX}/worker:${WATTWISELY_VERSION}
    build: { context: .., dockerfile: apps/worker/Dockerfile }
    <<: [*restart, *logging]
    environment:
      PORT: 3200
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgres://wattwisely_app:${DB_APP_PASSWORD}@postgres:5432/wattwisely
      # The same Stripe key as the API: the worker captures and releases card holds.
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      # Module 11: the worker sends alert e-mails, driver updates and receipts, and finished
      # exports and scheduled reports, through the same SMTP server as the API.
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_FROM: ${SMTP_FROM}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-false}
      # Tenant logos in e-mails come from the API; alert and export e-mails link to the portal.
      API_URL: ${PUBLIC_SCHEME}://${API_HOST}
      PORTAL_URL: ${PUBLIC_SCHEME}://${PORTAL_HOST}
      # Module 12: finished exports go to object storage instead of a database row.
      S3_ENDPOINT: http://object-storage:8333
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      # How long old rows are kept, in days (the retention job runs hourly).
      RETENTION_OCPP_MESSAGES_DAYS: ${RETENTION_OCPP_MESSAGES_DAYS:-90}
      RETENTION_OUTBOX_DAYS: ${RETENTION_OUTBOX_DAYS:-30}
      RETENTION_BELL_DAYS: ${RETENTION_BELL_DAYS:-90}
      RETENTION_DRIVER_EMAIL_DAYS: ${RETENTION_DRIVER_EMAIL_DAYS:-30}
      RETENTION_EXPORTS_DAYS: ${RETENTION_EXPORTS_DAYS:-90}
      RETENTION_WEBHOOK_EVENTS_DAYS: ${RETENTION_WEBHOOK_EVENTS_DAYS:-90}
      RETENTION_WEBHOOK_DELIVERIES_DAYS: ${RETENTION_WEBHOOK_DELIVERIES_DAYS:-30}
      # Module 16: webhook scan and delivery cadence; endpoints must be public addresses.
      WEBHOOK_INTERVAL_MS: ${WEBHOOK_INTERVAL_MS:-15000}
      WEBHOOK_ALLOW_PRIVATE_URLS: 'false'
      # Module 17: load management rounds and chat sending; chat links point at the driver app.
      LOAD_MANAGEMENT_INTERVAL_MS: ${LOAD_MANAGEMENT_INTERVAL_MS:-10000}
      MESSAGING_INTERVAL_MS: ${MESSAGING_INTERVAL_MS:-10000}
      DRIVER_URL: ${PUBLIC_SCHEME}://${DRIVER_HOST}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
    networks: [backend]
    depends_on:
      postgres: { condition: service_healthy }
      api: { condition: service_healthy }
      object-storage: { condition: service_started }

  # The page a driver's phone opens after scanning a plug's QR code (module 7): prices,
  # card payment, the charge as it runs, the receipt. Static files; it talks to the API.
  driver:
    image: ${WATTWISELY_IMAGE_PREFIX}/driver:${WATTWISELY_VERSION}
    build: { context: .., dockerfile: apps/driver/Dockerfile }
    <<: [*restart, *logging]
    environment:
      DRIVER_API_URL: ${PUBLIC_SCHEME}://${API_HOST}
      # Drivers may log in (module 19) with their own Keycloak client, which skips the mandatory authenticator app.
      DRIVER_KEYCLOAK_URL: ${PUBLIC_SCHEME}://${AUTH_HOST}
      DRIVER_KEYCLOAK_REALM: wattwisely
      DRIVER_KEYCLOAK_CLIENT_ID: wattwisely-driver
    networks: [backend]

  # The admin console (module 9): Wattwisely staff manage tenants, plans, add-ons and each
  # other here. Static files; it talks to the API, which checks the staff role on every call.
  admin:
    image: ${WATTWISELY_IMAGE_PREFIX}/admin:${WATTWISELY_VERSION}
    build: { context: .., dockerfile: apps/admin/Dockerfile }
    <<: [*restart, *logging]
    environment:
      ADMIN_API_URL: ${PUBLIC_SCHEME}://${API_HOST}
      ADMIN_KEYCLOAK_URL: ${PUBLIC_SCHEME}://${AUTH_HOST}
      ADMIN_KEYCLOAK_REALM: wattwisely
      ADMIN_KEYCLOAK_CLIENT_ID: wattwisely-admin
    networks: [backend]

  # ---------- Login: Keycloak ----------
  keycloak:
    image: keycloak/keycloak:26.8.1
    <<: [*restart, *logging]
    command: ['start', '--import-realm']
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_HOSTNAME: ${PUBLIC_SCHEME}://${AUTH_HOST}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: 'true'
      KC_HTTP_ENABLED: 'true'
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: 'true'
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      # Values used by keycloak/realm/wattwisely-realm.json when the realm is first imported.
      PORTAL_URL: ${PUBLIC_SCHEME}://${PORTAL_HOST}
      PORTAL_DEV_URL: ${PORTAL_DEV_URL:-${PUBLIC_SCHEME}://${PORTAL_HOST}}
      ADMIN_URL: ${PUBLIC_SCHEME}://${ADMIN_HOST}
      ADMIN_DEV_URL: ${ADMIN_DEV_URL:-${PUBLIC_SCHEME}://${ADMIN_HOST}}
      DRIVER_URL: ${PUBLIC_SCHEME}://${DRIVER_HOST}
      DRIVER_DEV_URL: ${DRIVER_DEV_URL:-${PUBLIC_SCHEME}://${DRIVER_HOST}}
      KC_REALM_SSL_REQUIRED: external
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_FROM: ${SMTP_FROM}
      SMTP_AUTH: ${SMTP_AUTH:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-false}
    volumes:
      - ./keycloak/realm:/opt/keycloak/data/import:ro
    networks: [backend]
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      # The image has no curl, so the check talks HTTP over bash's /dev/tcp. It looks at the
      # status line (200 ready, 503 not ready), not the body: a DOWN answer still lists some
      # sub-checks as "UP".
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '^HTTP/1\.1 200 ' <&3
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s

  # ---------- Data ----------
  postgres:
    image: postgres:16.15-alpine
    <<: [*restart, *logging]
    environment:
      POSTGRES_DB: wattwisely
      POSTGRES_USER: wattwisely
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    networks: [backend]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U wattwisely -d wattwisely']
      interval: 10s
      timeout: 5s
      retries: 10

  valkey:
    image: valkey/valkey:9.1.2-alpine
    <<: [*restart, *logging]
    command: ['valkey-server', '--requirepass', '${VALKEY_PASSWORD}', '--appendonly', 'yes']
    volumes:
      - valkey-data:/data
    networks: [backend]
    healthcheck:
      test: ['CMD-SHELL', 'valkey-cli -a "$$VALKEY_PASSWORD" --no-auth-warning ping | grep -q PONG']
      interval: 10s
      timeout: 5s
      retries: 10
    environment:
      VALKEY_PASSWORD: ${VALKEY_PASSWORD}

  # Secrets store (Stripe keys, tenant credentials). Starts sealed; up.sh unseals it.
  openbao:
    image: openbao/openbao:2.7.1
    <<: [*restart, *logging]
    command: ['server']
    environment:
      BAO_ADDR: http://127.0.0.1:8200
    volumes:
      - ./openbao/config.hcl:/openbao/config/config.hcl:ro
      - openbao-data:/openbao/file
    networks: [backend]

  # S3-compatible file storage (logos, invoices, exports).
  object-storage:
    image: chrislusf/seaweedfs:4.48
    <<: [*restart, *logging]
    command: ['server', '-dir=/data', '-s3', '-s3.port=8333', '-s3.config=/etc/seaweedfs/s3.json']
    volumes:
      - ./seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
      - object-storage-data:/data
    networks: [backend]

  # ---------- Monitoring (COMPOSE_PROFILES=monitoring, module 12) ----------
  # Prometheus reads /metrics from the three services and the server every 15 seconds,
  # Alertmanager e-mails what goes wrong, Grafana shows it. Only reachable from the server
  # itself: open http://localhost:3300 through an SSH tunnel (see README.md).
  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: [monitoring]
    <<: [*restart, *logging]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-30d}
    ports:
      - '127.0.0.1:9090:9090'
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    networks: [backend]

  alertmanager:
    image: prom/alertmanager:v0.34.1
    profiles: [monitoring]
    <<: [*restart, *logging]
    entrypoint: ['/bin/sh', '/etc/alertmanager-template/start.sh']
    environment:
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_FROM: ${SMTP_FROM}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-false}
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:-${ACME_EMAIL}}
    ports:
      - '127.0.0.1:9093:9093'
    volumes:
      - ./monitoring/alertmanager:/etc/alertmanager-template:ro
      - alertmanager-data:/alertmanager
    networks: [backend]

  grafana:
    image: grafana/grafana-oss:12.1.0
    profiles: [monitoring]
    <<: [*restart, *logging]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/wattwisely-overview.json
    ports:
      - '127.0.0.1:3300:3000'
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    networks: [backend]
    depends_on: [prometheus]

  # Disk, memory and CPU of the server itself, for the "disk almost full" alert, and what
  # backup.sh and restore-drill.sh last did (monitoring/textfile), for the backup alerts.
  node-exporter:
    image: prom/node-exporter:v1.12.1
    profiles: [monitoring]
    <<: [*restart, *logging]
    command: ['--path.rootfs=/host', '--collector.textfile.directory=/textfile']
    pid: host
    volumes:
      - /:/host:ro,rslave
      - ./monitoring/textfile:/textfile:ro
    networks: [backend]

  # ---------- Development only (COMPOSE_PROFILES=dev) ----------
  # Catches every e-mail so nothing reaches real inboxes. Web UI on http://localhost:8025.
  mailpit:
    image: axllent/mailpit:v1.32.0
    profiles: [dev]
    <<: [*restart, *logging]
    ports:
      - '127.0.0.1:8025:8025'
      - '127.0.0.1:1025:1025'
    networks: [backend]

  # Lets "npm start" on this machine reach Postgres at 127.0.0.1:5432
  # (POSTGRES_DEV_PORT picks another port when a local Postgres already uses 5432).
  postgres-dev-port:
    image: alpine/socat:1.8.1.3
    profiles: [dev]
    <<: [*restart, *logging]
    command: ['TCP-LISTEN:5432,fork,reuseaddr', 'TCP:postgres:5432']
    ports:
      - '127.0.0.1:${POSTGRES_DEV_PORT:-5432}:5432'
    networks: [backend]

networks:
  backend:

volumes:
  caddy-data:
  caddy-config:
  postgres-data:
  valkey-data:
  openbao-data:
  object-storage-data:
  prometheus-data:
  alertmanager-data:
  grafana-data:
