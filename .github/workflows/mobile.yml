# The mobile app (module 30): on every pull request that touches it, or the code it shares,
# Android builds a debug APK to install by hand, and iOS builds for the simulator without
# signing, so a break in either native project shows before merging. Lint, tests and the
# web build of apps/mobile run with everything else in ci.yml.
name: Mobile

on:
  pull_request:
    paths:
      - apps/mobile/**
      - packages/driver-core/**
      - packages/theme/**
      - packages/ui/**
      - package.json
      - package-lock.json
      - .github/workflows/mobile.yml
  push:
    branches: [main]
    paths:
      - apps/mobile/**
      - packages/driver-core/**
      - packages/theme/**
      - packages/ui/**
      - package.json
      - package-lock.json

permissions:
  contents: read

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install -g npm@11
      - run: npm ci
      # With the repository variables MOBILE_API_URL and MOBILE_KEYCLOAK_URL set, the APK talks
      # to that server (a staging server, say); without them, to a development machine.
      - name: Point the app at the test server
        env:
          API_URL: ${{ vars.MOBILE_API_URL }}
          KEYCLOAK_URL: ${{ vars.MOBILE_KEYCLOAK_URL }}
        run: |
          if [ -n "$API_URL" ] && [ -n "$KEYCLOAK_URL" ]; then
            printf '{"apiUrl":"%s","keycloakUrl":"%s","keycloakRealm":"wattwisely","keycloakClientId":"wattwisely-driver"}\n' \
              "$API_URL" "$KEYCLOAK_URL" > apps/mobile/public/config.json
          fi
          cat apps/mobile/public/config.json
      # Builds the app, copies it into the Android project (cap sync) and runs Gradle.
      - run: npx nx run mobile:apk
      - uses: actions/upload-artifact@v5
        with:
          name: wattwisely-debug-apk
          path: apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

  ios:
    name: iOS simulator build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install -g npm@11
      - run: npm ci
      - run: npx nx run mobile:sync
      - name: Build for the simulator, unsigned
        run: |
          xcodebuild -project apps/mobile/ios/App/App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build
