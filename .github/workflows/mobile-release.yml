# Sends the mobile app to testers (module 31): Google Play's internal testing track and TestFlight.
# A tag mobile-v1.2.0 releases version 1.2.0 against the production server; running the workflow
# by hand releases any version against staging or production. The server's addresses are the
# variables of the GitHub environment mobile-staging or mobile-production; the signing keys are
# secrets. docs/modules/31-mobile-release.md lists them and how to make each one.
name: Mobile release

on:
  push:
    tags: ['mobile-v*']
  workflow_dispatch:
    inputs:
      version:
        description: The version testers see, such as 1.2.0
        required: true
      environment:
        description: The server the app talks to
        type: choice
        options: [staging, production]
        default: staging

permissions:
  contents: read

concurrency:
  group: mobile-release
  cancel-in-progress: false

jobs:
  version:
    name: Version and build number
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      build-number: ${{ steps.version.outputs.build-number }}
      environment: ${{ steps.version.outputs.environment }}
    steps:
      # Both stores refuse a build number they have seen. The run number grows with every run,
      # and the attempt keeps a re-run apart: run 7 is build 71, its re-run build 72.
      - id: version
        env:
          TAG: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            version="${TAG#mobile-v}"
            environment=production
          else
            version="$INPUT_VERSION"
            environment="$INPUT_ENVIRONMENT"
          fi
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::The version must be three numbers, such as 1.2.0, not '$version'"
            exit 1
          fi
          {
            echo "version=$version"
            echo "build-number=$((GITHUB_RUN_NUMBER * 10 + GITHUB_RUN_ATTEMPT))"
            echo "environment=mobile-$environment"
          } | tee -a "$GITHUB_OUTPUT"

  android:
    name: Google Play internal testing
    needs: version
    runs-on: ubuntu-latest
    environment: ${{ needs.version.outputs.environment }}
    env:
      APP_VERSION: ${{ needs.version.outputs.version }}
      APP_BUILD_NUMBER: ${{ needs.version.outputs.build-number }}
      # The driver web app's domain, whose plug and invitation links open the app (module 32).
      APP_LINK_HOST: ${{ vars.MOBILE_DRIVER_HOST }}
    # Secrets go only to the steps that use them, never to npm's install scripts.
    steps:
      - name: Check the secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          missing=""
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS \
            ANDROID_KEY_PASSWORD PLAY_SERVICE_ACCOUNT_JSON APP_LINK_HOST; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Set these secrets and variables first:$missing"
            exit 1
          fi
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install -g npm@11
      - run: npm ci
      - uses: ./.github/actions/mobile-config
        with:
          api-url: ${{ vars.MOBILE_API_URL }}
          keycloak-url: ${{ vars.MOBILE_KEYCLOAK_URL }}
          is-required: 'true'
      # Firebase's settings for pushes (module 34). A build without them installs and runs, but
      # takes no pushes, so a missing secret is a warning, not a stop.
      - name: Write Firebase's settings
        env:
          MOBILE_GOOGLE_SERVICES_JSON: ${{ secrets.MOBILE_GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$MOBILE_GOOGLE_SERVICES_JSON" ]; then
            echo "::warning::MOBILE_GOOGLE_SERVICES_JSON is not set: this build takes no pushes"
            exit 0
          fi
          printf '%s' "$MOBILE_GOOGLE_SERVICES_JSON" > apps/mobile/android/app/google-services.json
          if ! grep -q '"package_name": *"com.wattwisely.driver"' apps/mobile/android/app/google-services.json; then
            echo "::error::MOBILE_GOOGLE_SERVICES_JSON is not the google-services.json of com.wattwisely.driver"
            exit 1
          fi
      - name: Write the upload key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
      # Builds the app, copies it into the Android project and signs the App Bundle.
      - run: npx nx run mobile:bundle
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      # Kept before the upload: Google Play takes an app's very first bundle only by hand.
      - uses: actions/upload-artifact@v5
        with:
          name: wattwisely-${{ env.APP_VERSION }}-${{ env.APP_BUILD_NUMBER }}-aab
          path: apps/mobile/android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: apps/mobile
      - name: Upload to internal testing
        working-directory: apps/mobile
        env:
          FASTLANE_SKIP_UPDATE_CHECK: '1'
          FASTLANE_HIDE_CHANGELOG: '1'
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          PLAY_RELEASE_STATUS: ${{ vars.PLAY_RELEASE_STATUS }}
        run: bundle exec fastlane android internal

  ios:
    name: TestFlight
    needs: version
    runs-on: macos-latest
    environment: ${{ needs.version.outputs.environment }}
    env:
      APP_VERSION: ${{ needs.version.outputs.version }}
      APP_BUILD_NUMBER: ${{ needs.version.outputs.build-number }}
      # The driver web app's domain, whose plug and invitation links open the app (module 32).
      APP_LINK_HOST: ${{ vars.MOBILE_DRIVER_HOST }}
      IOS_TEAM_ID: ${{ vars.IOS_TEAM_ID }}
    steps:
      - name: Check the secrets
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          IOS_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
        run: |
          missing=""
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8_BASE64 IOS_CERTIFICATE_P12_BASE64 \
            IOS_CERTIFICATE_PASSWORD IOS_TEAM_ID APP_LINK_HOST; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Set these secrets and variables first:$missing"
            exit 1
          fi
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install -g npm@11
      - run: npm ci
      - uses: ./.github/actions/mobile-config
        with:
          api-url: ${{ vars.MOBILE_API_URL }}
          keycloak-url: ${{ vars.MOBILE_KEYCLOAK_URL }}
          is-required: 'true'
      # Builds the app and copies it into the iOS project.
      - run: npx nx run mobile:sync
      - name: Write the distribution certificate
        env:
          IOS_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
        run: |
          printf '%s' "$IOS_CERTIFICATE_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/distribution.p12"
          echo "IOS_CERTIFICATE_PATH=$RUNNER_TEMP/distribution.p12" >> "$GITHUB_ENV"
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: apps/mobile
      - name: Sign, archive and upload to TestFlight
        working-directory: apps/mobile
        env:
          FASTLANE_SKIP_UPDATE_CHECK: '1'
          FASTLANE_HIDE_CHANGELOG: '1'
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
        run: bundle exec fastlane ios beta
      - uses: actions/upload-artifact@v5
        with:
          name: wattwisely-${{ env.APP_VERSION }}-${{ env.APP_BUILD_NUMBER }}-ipa
          path: apps/mobile/build/ios/*.ipa
          retention-days: 30
