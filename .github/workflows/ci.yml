# Runs on every pull request and every push to main:
# lint (coding standards), tests, builds, formatting, deploy scripts and the Compose file.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code:
    name: Lint, test, build
    runs-on: ubuntu-latest
    services:
      # A throw-away Postgres for the API tests: each test file migrates its own database.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install -g npm@11
      - run: npm ci
      - run: npx prettier --check .
      - run: npx nx run-many -t lint test build

  deploy:
    name: Deploy folder
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check shell scripts
        run: shellcheck --external-sources --source-path=SCRIPTDIR deploy/scripts/*.sh deploy/scripts/lib/*.sh deploy/postgres/init/*.sh apps/portal/docker/*.sh apps/admin/docker/*.sh
      - name: Check the Compose file
        working-directory: deploy
        run: |
          cp .env.example .env
          docker compose config --quiet
