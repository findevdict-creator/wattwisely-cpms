# Dependency scanning (module 12). Fails when a package the running services ship with has a
# known high or critical vulnerability. Runs on pull requests, on main and every Monday, so a
# new advisory against an unchanged lock file still shows up.
# Development tools (the Angular build, test runners) are left out: they never reach a server.
# Dependabot (.github/dependabot.yml) proposes the upgrades.
name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: npm audit (production packages)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: npm install -g npm@11
      # Reads package-lock.json only; nothing is installed.
      - run: npm audit --omit=dev --audit-level=high
