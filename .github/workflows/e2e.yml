# The end-to-end suite (apps/e2e): the whole stack on the runner (Postgres, Keycloak, Mailpit,
# the API, the OCPP gateway, the worker and the four web apps), then Playwright drives the
# portal, the admin console, the driver web app and the mobile app's web build, and talks OCPP
# to the gateway as a charger would. Nightly, on every push to main, and by hand.
name: End-to-end tests

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    name: Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install -g npm@11
      - run: npm ci
      # Keycloak answers on auth.localhost, as in a local trial.
      - run: echo "127.0.0.1 auth.localhost" | sudo tee -a /etc/hosts
      - run: npx playwright install --with-deps chromium
      - run: npx nx run-many -t build -p api ocpp-gateway worker charger-sim-cli portal driver admin mobile
      - run: apps/e2e/stack/stack-up.sh
      - run: apps/e2e/stack/apps-up.sh
      - name: Run the suite
        run: npx nx run e2e:e2e
      - name: Write the summary
        if: always()
        run: |
          node apps/e2e/tools/write-summary.mjs
          cat dist/e2e-report/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: e2e-report
          path: |
            dist/e2e-report
            dist/e2e-results/artifacts
            dist/e2e-stack/logs
          retention-days: 30
      - if: always()
        run: apps/e2e/stack/stack-down.sh
